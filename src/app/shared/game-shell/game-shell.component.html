<div class="shell-main">
  @if (finished()) {
    <div class="winner-banner">
      @if (winnerName(); as name) {
        <h2><span aria-hidden="true">🎯</span> {{ name }} wins!</h2>
      } @else if (draw()) {
        <h2><span aria-hidden="true">🤝</span> Draw!</h2>
      }
      <div class="banner-actions">
        <button type="button" class="primary" (click)="rematch.emit()">Rematch</button>
        <button type="button" (click)="leave.emit()">Leave to setup</button>
      </div>
    </div>
  } @else {
    <p class="current-player">
      Up next: <strong>{{ currentPlayerName() }}</strong>
    </p>
  }

  @if (message(); as msg) {
    <p class="message" aria-live="polite">{{ msg }}</p>
  }

  <ng-content />
</div>

@if (!finished()) {
  <div class="shell-pad">
    <app-turn-summary [turn]="turn()" />
    <app-dart-input (dartThrow)="dartThrow.emit($event)" />
    <app-game-actions
      [undoDisabled]="undoDisabled()"
      [endTurnDisabled]="endTurnDisabled()"
      (undo)="undo.emit()"
      (endTurn)="endTurn.emit()"
    />
  </div>
}
