<main class="home">
  <h1>Home</h1>

  <div class="field">
    <label for="gamemode">Pick a gamemode</label>
    <select id="gamemode" [(ngModel)]="selectedGamemode">
      @for (mode of gameModes; track mode) {
        <option [value]="mode">{{ mode }}</option>
      }
    </select>
  </div>

  @if (selectedGamemode === 'x01') {
    <div class="field">
      <label for="x01-score">Starting score</label>
      <select id="x01-score" [(ngModel)]="selectedX01Score">
        @for (score of x01Scores; track score) {
          <option [value]="score">{{ score }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label for="x01-double-in">Double in</label>
      <select id="x01-double-in" [(ngModel)]="selectedDoubleIn">
        <option [ngValue]="false">Off</option>
        <option [ngValue]="true">On</option>
      </select>
    </div>

    <div class="field">
      <label for="x01-double-out">Double out</label>
      <select id="x01-double-out" [(ngModel)]="selectedDoubleOut">
        <option [ngValue]="false">Off</option>
        <option [ngValue]="true">On</option>
      </select>
    </div>
  }

  <app-add-players (playersChange)="onPlayersChange($event)" />

  <button type="button" class="start" (click)="startGame()" [disabled]="players.length === 0">
    Start game
  </button>
</main>
